<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산 공영주차장</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>부산 공영주차장</h1>
      <p>부산시설공단에서 제공하는 주차장 목록을 확인하세요.</p>
    </header>
    <section class="panel" aria-label="주차장 목록">
      <div class="toolbar">
        <h2>주차장 목록</h2>
        <button id="load-button" type="button">목록 불러오기</button>
      </div>
      <p id="status" role="status" aria-live="polite">버튼을 누르면 주차장 목록을 불러옵니다.</p>
      <ul id="parking-list" aria-busy="false"></ul>
    </section>
    <p class="note">현재는 목록 조회 단계입니다. 실시간 빈자리·주소·요금은 다음 단계에서 추가합니다.</p>
  </main>
</body>
</html>
