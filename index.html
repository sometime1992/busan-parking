<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565c0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>부산 공영주차장</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">BUSAN PARKING</p>
      <h1>부산 공영주차장</h1>
      <p>시설공단 주차장의 빈자리와 주소·요금·운영시간을 확인하세요.</p>
    </header>
    <section class="install-panel" aria-label="홈 화면 설치 안내">
      <p>홈 화면에 추가하면 앱처럼 사용할 수 있습니다.</p>
      <button id="install-button" type="button" hidden>앱처럼 설치하기</button>
      <p id="install-help" class="note">Android·PC는 브라우저 메뉴의 설치 또는 홈 화면 추가를 이용하세요. iPhone은 Safari의 공유 메뉴 → 홈 화면에 추가를 선택하세요.</p>
    </section>
    <p id="connection-status" class="warning" role="status" aria-live="polite" hidden></p>
    <section class="panel" aria-label="주차장 검색">
      <form id="search-form">
        <label for="search">주차장 이름 검색</label>
        <div class="search-row">
          <input id="search" type="search" placeholder="예: 화명, 장산역" autocomplete="off">
          <button type="submit">검색</button>
        </div>
      </form>
      <div class="toolbar">
        <label for="sort">정렬 <select id="sort"><option value="available" selected>빈자리 많은 순</option><option value="name">이름순</option></select></label>
        <button id="load-button" type="button">새로고침</button>
        <label class="auto"><input id="auto-refresh" type="checkbox"> 5분마다 자동갱신</label>
      </div>
      <p id="status" role="status" aria-live="polite">주차장 정보를 불러옵니다.</p>
      <p id="warnings" class="warning" role="status"></p>
      <p id="summary" class="note"></p>
    </section>
    <ul id="parking-list" aria-label="주차장 검색 결과" aria-busy="false"></ul>
    <p class="note">실시간 현황 출처: 부산시설공단 · 기본정보 출처: 부산광역시<br>빈자리는 제공기관 갱신 시점의 정보입니다. 요금·운영시간은 기준일을 확인하고 현장 안내를 우선해 주세요.</p>
  </main>
</body>
</html>
